[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-redes-sociales"
version = "0.3.0"
description = "Analizador de conversaciones exportadas de redes sociales"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Carlos Anguita Rodríguez"},
  {name = "Javier del Pozo Pérez"},
  {name = "Nicolás García Macías"},
  {name = "Quanan Wei"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6"
]

[project.scripts]
analizador-redes = "analizador_redes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=analizador_redes --cov-report=term-missing --cov-fail-under=55"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["analizador_redes"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
