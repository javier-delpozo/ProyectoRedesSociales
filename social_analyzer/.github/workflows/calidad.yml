name: Calidad

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Estilo
        run: ruff check .
      - name: Pruebas y cobertura
        run: pytest
      - name: Prueba de integración explícita
        run: pytest -m integration
      - name: Construir distribución
        run: python -m build
      - name: Generar documentación API
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pdoc -o build/docs/api analizador_redes
      - name: Publicar documentación API
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-api
          path: build/docs/api
